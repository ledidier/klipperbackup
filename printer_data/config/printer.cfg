[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2300210005504E5238363120-if00

[mcu EBBCan]
#canbus_uuid: c9a050a786cc
canbus_uuid: df031f426749

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2800 #ehem3000 - geaender wegen Resonance-Messung vom 03.06.23
#max_accel_to_decel: 2800 # ehem3000
max_z_velocity: 5 #ehem10
max_z_accel: 100
# aenderung aufgrund von Resonanztest: square_corner_velocity:  war urprünglich auf 20
square_corner_velocity: 5

[heater_fan hotend_fan]
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[resonance_tester]
accel_chip: adxl345
probe_points:
    110, 110, 20  # an example

[adxl345]
cs_pin: EBBCan: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z


[input_shaper]
#shaper_freq_x: 46.8
#shaper_type_x: mzv
#shaper_freq_y: 31.0
#shaper_type_y: mzv
# ergebnis einer Messung an der y/x-Achse 09.01 24
# 

# Enable object exclusion
[exclude_object]

#[include pause.cfg]
#[include resume.cfg]
#[include search_vars.cfg]
#[include home_if_needed.cfg]
#[include maintenance.cfg]
#[include filament.cfg]

#[save_variables]
#filename: ~/variables.cfg

#[pause_resume]

#[respond]

#umgebastelt wegen belegung von stp_pins

[safe_z_home]
home_xy_position: 150.5, 107.5
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 215
position_min: 0
position_max: 215
homing_speed: 20
homing_retract_dist: 0
homing_positive_dir: true


[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
diag_pin: ^PC0   # Set to MCU pin connected to TMC DIAG pin
uart_address: 0
run_current: 0.580
hold_current: 0.50
sense_resistor: 0.1100
stealthchop_threshold: 999999
driver_SGTHRS: 55 # 255 is most sensitive value, 0 is least sensitive
#homing_retract_dist: 0

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 215
position_min: 0
position_max: 215
homing_speed: 20
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
diag_pin: ^PC1 # Set to MCU pin connected to TMC DIAG pin
uart_address: 2
sense_resistor: 0.110
run_current: 0.580
hold_current: 0.50
stealthchop_threshold: 999999
driver_SGTHRS: 75  # 255 is most sensitive value, 0 is least sensitive
#homing_retract_dist: 0

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
#position_endstop: -5
position_min: -10
position_max: 300
homing_speed: 5

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.48
sense_resistor: 0.110
#hold_current: 0.48  
stealthchop_threshold: 999999

[extruder]
step_pin: EBBCan: PD0
dir_pin: !EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
#rotation_distance: 24.395
#rotation_distance: 33.500 wert von Vorgabe - aber ohne micro swiss vermutlich
#rotation_distance: 25.61475 Wert nach SuperSlicer FlowCalibration um 2% erhöh
#rotation_distance: 26.127045 alter Wert
rotation_distance: 3.433
#control = pid
#pid_Kp = 23.120
#pid_Ki = 1.056
#pid_Kd = 126.579

nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: EBBCan: PA3
pressure_advance: 0.045
#ermittelt mit klipper methode
sensor_type:MAX31865
sensor_pin: EBBCan: PA4

max_extrude_cross_section: 5

spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2
max_extrude_only_distance: 101
min_temp: 0
max_temp: 300


[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.455
stealthchop_threshold: 0

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: pid
min_temp: 0
max_temp: 130
pid_Kp = 66.707
pid_Ki = 0.643
pid_Kd = 1731.044

[fan] 
pin: EBBCan: PA1
max_power: 0.75 # Begrenzt auf max. 75%
kick_start_time: 0.5 # schaltet kurz auf 100%
off_below: 0.10 # schaltet aus wenn unter 10% Leistung

# auskommentiert wegen nachfolgender Änderung
#[fan_generic Case] 
#pin: PC7

[temperature_fan mcu_fan]
pin: PC6
sensor_type: temperature_mcu # Misst direkt die Temperatur des Mainboard-Chips
control: watermark           # Einfache Ein/Aus-Regelung (leiser im Wechsel)
min_temp: 10
max_temp: 70
target_temp: 45.0            # Schaltet sich ab 45°C ein, um die Treiber zu kühlen


[temperature_fan raspi_fan]
pin: PC7
#max_power:
#shutdown_speed:
#cycle_time:
#hardware_pwm:
#kick_start_time:
#off_below:
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#enable_pin:
#   See the "fan" section for a description of the above parameters.
sensor_type: temperature_host
#sensor_pin:
control:pid
target_temp: 50.0
#max_delta:
min_temp:20
max_temp:75
max_speed:0.9
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when the sensor temperature exceeds the set value.
min_speed: 0.2
#   Th
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 2.0

#eingefuegt wegen CAN-BUS Integration
[heater_fan hotend_fan]
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0


[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>


[bltouch]
#sensor_pin: EBBCan:PB8
sensor_pin: ^EBBCan:PB8
control_pin: EBBCan:PB9
x_offset: -43
y_offset: 0
#Higher the offset, the closer to the bed the nozzle will be.
#Lower the offset, the further the nozzle will be.
#If you need more squish or if it's too high, increase the offset.
#If it's too close, lower the offset.
#z_offset = 5.090
pin_move_time: 1
probe_with_touch_mode: True
samples: 2
sample_retract_dist: 4.0
#stow_on_each_sample: False
speed: 2.0
#set_debounce: 0.050

[bed_mesh]
speed: 120
horizontal_move_z: 8
mesh_min: 15, 10
mesh_max: 172, 210
probe_count: 5, 5
fade_start: 0
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 5

[screws_tilt_adjust]
# -------------------------------------------------------------------------
# RECHTE SCHRAUBEN (Jetzt auf X=0 verschoben)
# Wenn wir hier X=0 eintragen, zwingen wir Klipper, die Düse ganz nach rechts
# an den mechanischen Anschlag zu fahren. Der BL-Touch steht dann bei X=40 
# und misst so weit rechts, wie es für ihn physisch überhaupt machbar ist.
# -------------------------------------------------------------------------
screw2: 1, 20        # Hinten Rechts (Extruder fährt auf Anschlag rechts)
screw2_name: Hinten Rechts

screw3: 1, 185       # Vorne Rechts (Extruder fährt auf Anschlag rechts)
screw3_name: Vorne Rechts

# -------------------------------------------------------------------------
# LINKE SCHRAUBEN (Von X=175 auf X=135 reduziert)
# Indem wir den Wert auf 135 senken, fährt Klipper den Kopf weiter nach rechts.
# Die Düse steht beim Messen dann auf X=95, wodurch der BL-Touch exakt auf 
# X=135 positioniert wird (was genau über Ihren linken Schrauben liegen sollte).
# -------------------------------------------------------------------------
screw1: 152, 20      # Hinten Links
screw1_name: Hinten Links

screw4: 152, 182     # Vorne Links
screw4_name: Vorne Links

horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

# 1. Raspberry Pi als sekundäre MCU definieren
[mcu rpi]
serial: /tmp/klipper_host_mcu

[output_pin system_led]
pin: rpi:gpio22        # Passe die GPIO-Nummer an
value: 1                # 1 = LED schaltet beim Start von Klipper ein
shutdown_value: 0       # 0 = LED geht aus, wenn Klipper stopt/herunterfährt

# 3. Taster für Shutdown konfigurieren
[gcode_button shutdown_button]
pin: ^!rpi:gpio25      # ^ = Interner Pull-Up Aktiv, ! = Invertiert (Taster schaltet gegen GND)
press_gcode:
  {action_respond_info("Shutdown-Taster gedrückt. Pi wird heruntergefahren...")}
  {action_call_remote_method("shutdown_machine")}


[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 # status led, Virtual MISO
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[neopixel neo] #Alte funktionieren Funktion
pin: PA8
chain_count: 16
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0

[neopixel hotend_rgb]
pin: EBBCan:PD3
chain_count:1
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 1

[print_stats]

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True


[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
gcode:
  {% if params.TOTAL_LAYER is defined %}
    SET_PRINT_STATS_INFO_BASE TOTAL_LAYER={params.TOTAL_LAYER}
  {% endif %}
  {% if params.CURRENT_LAYER is defined %}
    SET_PRINT_STATS_INFO_BASE CURRENT_LAYER={params.CURRENT_LAYER}
  {% endif %}


[gcode_macro LED_AN_WEISS]
gcode:
    SET_LED LED=neo RED=1.0 GREEN=1.0 BLUE=1.0 TRANSMIT=1

[gcode_macro LED_AN_ROT]
gcode:
    SET_LED LED=neo RED=1.0 GREEN=0.0 BLUE=0.0 TRANSMIT=1

[gcode_macro HOTEND_LED_BLAU]
gcode:
    SET_LED LED=hotend_rgb RED=0.0 GREEN=0.0 BLUE=0.8 TRANSMIT=1

[gcode_macro LED_AUS]
gcode:
    SET_LED LED=neo RED=0.0 GREEN=0.0 BLUE=0.0 TRANSMIT=1
    SET_LED LED=hotend_rgb RED=0.0 GREEN=0.0 BLUE=0.0 TRANSMIT=1

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
gcode:
    # 1. Führt die originale Klipper-Messung aus
    BASE_BED_MESH_CALIBRATE {rawparams}
    
    # 2. Ihre gewünschte Anschlussposition nach der Messung
    G90                           ; Absolute Positionierung
    G1 X100 Y100 Z10 F3000        ; Fährt auf X100 Y100 Z10 mit 50mm/s

[gcode_macro BETTSCHRAUBEN_PROBEN]
description: Führt das Screws Tilt Adjust aus (automatisiertes Homing + Messung)
gcode:
    # Falls der Drucker noch nicht gehomed ist, wird das jetzt erledigt
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # Startet die Berechnung für die Bettschrauben
    SCREWS_TILT_CALCULATE

[gcode_macro CAN_STATS]
description: Zeigt CAN-Bus Statistiken für eine bestimmte MCU an
gcode:
    {% set mcu_name = "mcu" %}  # Hier ggf. "EBBCan" oder deinen MCU-Namen eintragen
    {% set mcu = printer[mcu_name] %}
    {% if 'last_stats' in mcu %}
        {action_respond_info("MCU %s Stats:\n%s" % (mcu_name, mcu.last_stats))}
    {% else %}
        {action_respond_info("Keine Stats fuer MCU '%s' gefunden." % mcu_name)}
    {% endif %}

[gcode_macro START_PRINT]
gcode:
    # 1. Variablen vom Slicer einlesen (mit Standardwerten, falls nichts übergeben wird)
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    
    G90 ; absolute Koordinaten
    M83 ; Extruder relativer Modus
    
    # 2. Bett auf Zieltemperatur heizen & Düse auf 150°C vorheizen (gegen Oozing)
    M140 S{BED_TEMP}
    M104 S150
    
    # 3. Warten auf Betttemperatur
    M190 S{BED_TEMP}
    
    # 4. Homing und Adaptives Bed Mesh
    G28 ; Home all axis
    G1 X5 Y5 Z10 F3000 ; nach dem Homing etwas weg vom Rand
    BED_MESH_CALIBRATE ADAPTIVE=1 ; Hier wird nur die genutzte Fläche gemessen!
    
    # 5. Düse auf Endtemperatur heizen & warten
    G1 Z50 F240 ; Düse anheben für Sicherheit
    G1 X2.0 Y10 F3000 ; Zur Startposition fahren
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    SET_LED LED=neo RED=0.6 GREEN=0.5 BLUE=0.4 TRANSMIT=1
    
    # 6. Deine originalen Startlinien (Prime Lines)
    G1 Z0.28 F240
    G92 E0
    G1 X2.0 Y140 E10 F1500 ; Erste Linie
    G1 X2.3 Y140 F5000
    G92 E0
    G1 X2.3 Y10 E10 F1200 ; Zweite Linie
    G92 E0

[gcode_macro END_PRINT]
gcode:
    M104 S0 ; Düse ausschalten
    M140 S0 ; Bett ausschalten
    M107 ; Lüfter ausschalten
    G91 ; Relative Positionierung
    G1 E-2 F2700 ; Filament um 2mm zurückziehen (Retract gegen Tropfen/Fäden)
    G1 Z10 F3000 ; Düse 10mm anheben
    G90 ; Absolute Positionierung
    G1 X210 Y0 F3000 ; Bett nach vorne fahren (Y-Wert an deine Bettgröße anpassen!)
    M84 ; Motoren abschalten
	LED_AUS
    # NEU: Sendet eine Statusmeldung, die Home Assistant abgreifen kann
    M117 Druck beendet!

[gcode_macro LOAD_FILAMENT]
description: Heizt die Düse auf und lädt Filament
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(210)|int %}
    {% set MIN_TEMP = 180 %}
    
    SAVE_GCODE_STATE NAME=load_state
    M117 Filament wird geladen...
    
    # Prüfen ob Extruder heiß genug ist, sonst aufheizen
    {% if printer.extruder.temperature < MIN_TEMP or printer.extruder.target < MIN_TEMP %}
        M118 Heizt Düse auf {EXTRUDER_TEMP}°C...
        M109 S{EXTRUDER_TEMP}
    {% endif %}
    
    M118 Lade Filament...
    M83                            # Extruder auf relative Positionierung stellen
    G1 E50 F300                    # Schnelles Einziehen (50mm mit 5mm/s)
    G1 E30 F150                    # Langsames Durchspülen (30mm mit 2.5mm/s)
    G92 E0                         # Extruder-Zähler zurücksetzen
    
    RESTORE_GCODE_STATE NAME=load_state
    M118 Filament erfolgreich geladen!


[gcode_macro UNLOAD_FILAMENT]
description: Heizt die Düse auf und entlädt Filament
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(210)|int %}
    {% set MIN_TEMP = 180 %}
    
    SAVE_GCODE_STATE NAME=unload_state
    M117 Filament wird entladen...
    
    # Prüfen ob Extruder heiß genug ist, sonst aufheizen
    {% if printer.extruder.temperature < MIN_TEMP or printer.extruder.target < MIN_TEMP %}
        M118 Heizt Düse auf {EXTRUDER_TEMP}°C...
        M109 S{EXTRUDER_TEMP}
    {% endif %}
    
    M118 Entlade Filament...
    M83                            # Extruder auf relative Positionierung stellen
    G1 E10 F300                    # Kurzer Purge: Drückt etwas Filament raus, um Fäden/Pfeilspitzen zu verhindern
    G1 E-10 F3000                  # Schneller Rückzug aus der Schmelzzone
    G1 E-60 F1000                  # Restliches Filament aus dem Extruder ziehen
    G92 E0                         # Extruder-Zähler zurücksetzen
    
    RESTORE_GCODE_STATE NAME=unload_state
    M118 Filament erfolgreich entladen!

[gcode_macro SHOW_Z_OFFSET]
description: Zeigt den aktuell gespeicherten Z-Offset in der Konsole an
gcode:
    {% if "probe" in printer.configfile.config %}
        {% set offset = printer.configfile.config["probe"].z_offset %}
        {action_respond_info("Aktuell gespeicherter Probe Z-Offset: " ~ offset ~ " mm")}
    {% elif "bltouch" in printer.configfile.config %}
        {% set offset = printer.configfile.config["bltouch"].z_offset %}
        {action_respond_info("Aktuell gespeicherter BLTouch Z-Offset: " ~ offset ~ " mm")}
    {% else %}
        {action_respond_info("Kein [probe] oder [bltouch] in printer.cfg gefunden.")}
    {% endif %}


[idle_timeout]
timeout: 3600
gcode:
  {% if printer.webhooks.state == "printing" %}
    { action_respond_info("Idle timeout ignored because printer is printing.") }
  {% else %}
    TURN_OFF_HEATERS
    M84
  {% endif %}

